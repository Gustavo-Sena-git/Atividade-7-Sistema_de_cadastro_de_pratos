<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="styles/login-cadastro.css">
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>
    
    <div class="container">
        <form class="login-cadastro">
            <h1>Login</h1>
            <div class="campos">
                <input class="email-login" type="email" placeholder="Email" required>
                <input class="senha-login" type="password" placeholder="Senha" required>
            </div>
            <button class="botao" type="submit">Entrar</button>
            <p>Ainda não tem uma conta? <a href="cadastrar.html">Cadastre-se aqui</a></p>
        </form>
    </div>

</body>
</html>
