<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>
<body>
    
    <nav class="navbar">
        <a class="botao" href="cadastro.html">Cadastrar cliente</a>

        <h3>Figueiró | Sena - Cucina italiana</h3>
    </nav>

    <header>
        <h2 class="titulo">Pratos:</h2>
    </header>

    <main>

       <div class="modificar">

            <button type="button" onclick="abrirFormulario('novo')">
                Adicionar prato
            </button>
        
            <div id="novo" class="formulario">
                <form>
                    <h2>Novo prato</h2>
                
                    <label>Nome cliente:</label>
                    <input class="imput" type="text" name="nome">
                
                    <label>Preço:</label>
                    <input type="number" name="preco">
                
                    <label>Descrição:</label>
                    <textarea name="descricao"></textarea>
                
                    <button type="submit">Salvar</button>
                    <button type="button" onclick="fecharFormulario('novo')">
                        Cancelar
                    </button>
                </form>
            </div>

        </div>


        <div class="pratos">

            <div class="prato">
                <p>ID: </p>

                <p>Nome: </p>

                <p>Preço: </p>


                <button type="button" onclick="abrirFormulario('editar')">
                    Editar prato
                </button>
            
                <div id="editar" class="formulario">
                    <form>
                        <h2>Editar prato</h2>
                    
                        <label>Nome:</label>
                        <input class="imput" type="text" name="nome">
                    
                        <label>Preço:</label>
                        <input type="number" name="preco">
                    
                        <label>Descrição:</label>
                        <textarea name="descricao"></textarea>
                    
                        <button type="submit">Salvar</button>
                        <button type="button" onclick="fecharFormulario('editar')">
                            Cancelar
                        </button>
                    </form>
                </div>

                <button type="button">
                    Excluir prato
                </button>

            </div>
            
        </div>

    </main>

    <footer>
        <p>Sempre faça tudo com amor</p>
    </footer>

    <script>

        function abrirFormulario(id) {
    document.getElementById(id).style.display = "block";
    }

    function fecharFormulario(id) {
        document.getElementById(id).style.display = "none";
    }

    </script>

</body>
</html>
